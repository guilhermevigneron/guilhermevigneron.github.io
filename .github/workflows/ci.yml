name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly production smoke & external link rot check (Mondays 09:00 UTC)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  codeql:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4

  build_and_test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Single-Source Sync Parity Check
        run: npm run test:sync

      - name: Lint (Biome)
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      - name: Security Audit
        run: npm run test:security

      - name: Build static site, CSS/JS bundles, /resume.pdf & OG card
        run: npm run build -- --no-sync

      - name: HTML5 Validation
        run: npm run test:html

      - name: Link Checker (built site)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --root-dir ${{ github.workspace }}/_site --index-files index.html --remap "^https://guilhermevigneron\.dev file://${{ github.workspace }}/_site" --accept 200..=299,999 --no-progress ./_site/index.html ./_site/404.html ./_site/quality/index.html ./_site/architecture/index.html

      - name: Run Browser E2E & Accessibility Tests (Cypress)
        env:
          CYPRESS_BROWSER: chrome
        run: npm run test:e2e

      - name: Run Mobile Web Vitals & Asset Budget Audit
        run: npm run test:perf

      - name: Publish CI Telemetry to /quality Report
        env:
          LYCHEE_STATUS: ${{ steps.lychee.outcome }}
        run: |
          npm run build:quality
          npm run test:html
          node scripts/check-performance.mjs --quality-only

      - name: Verify /quality Telemetry Overall Status
        run: node -e "const r = JSON.parse(require('node:fs').readFileSync('./_site/quality/report.json', 'utf8')); if (r.overallStatus !== 'pass') { console.error(JSON.stringify(r, null, 2)); process.exit(1); }"

      - name: Link Checker (final /quality Report)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --root-dir ${{ github.workspace }}/_site --index-files index.html --remap "^https://guilhermevigneron\.dev file://${{ github.workspace }}/_site" --accept 200..=299,999 --no-progress ./_site/quality/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build_and_test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  production_smoke_tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'

      - name: Production Endpoint & Security Smoke Tests
        run: npm run test:smoke:prod

      - name: Production Link Checker (guilhermevigneron.dev)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --accept 200..=299,999 --no-progress https://guilhermevigneron.dev https://guilhermevigneron.dev/404.html https://guilhermevigneron.dev/quality/ https://guilhermevigneron.dev/architecture/