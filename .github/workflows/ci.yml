name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly production smoke & external link rot check (Mondays 09:00 UTC)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm run test:security

      - name: Check committed files match resume.json
        run: |
          npm run sync
          git diff --exit-code

      - name: Build static site, CSS/JS bundles, /resume.pdf & OG card
        run: npm run build

      - name: HTML5 Validation
        run: npm run test:html

      - name: Link Checker (built site)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --root-dir ${{ github.workspace }}/_site --accept 200..=299,999 --exclude '^https://guilhermevigneron\.dev/(quality/|assets/og-card\.png)$' --no-progress ./_site/index.html ./_site/404.html ./_site/quality/index.html

      - name: Run Browser E2E & Accessibility Tests (Cypress)
        env:
          CYPRESS_BROWSER: chrome
        run: npm run test:e2e

      - name: Run Mobile Web Vitals & Asset Budget Audit
        run: npm run test:perf

      - name: Publish CI Telemetry to /quality Report
        env:
          LYCHEE_STATUS: ${{ steps.lychee.outcome }}
        run: |
          npm run build:quality
          npm run test:html

      - name: Link Checker (final /quality Report)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --root-dir ${{ github.workspace }}/_site --accept 200..=299,999 --exclude '^https://guilhermevigneron\.dev/quality/$' --no-progress ./_site/quality/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build_and_test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  production_smoke_tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Production Endpoint & Security Smoke Tests
        run: npm run test:smoke:prod

      - name: Production Link Checker (guilhermevigneron.dev)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --accept 200..=299,999 --no-progress https://guilhermevigneron.dev https://guilhermevigneron.dev/quality/